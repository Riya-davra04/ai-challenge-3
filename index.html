<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI Carbon Footprint Assistant">
<meta name="theme-color" content="#0f172a">
<title>AI Carbon Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0f172a;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: 0.3s;
}

.light-mode {
  background: #f1f5f9;
  color: black;
}

.header {
  padding: 15px;
  background: #020617;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  position: relative;
}

.toggle-btn {
  position: absolute;
  right: 15px;
  top: 10px;
  cursor: pointer;
}

.light-mode .header {
  background: #e2e8f0;
}

.chat-container {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.message {
  max-width: 70%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  line-height: 1.5;
  position: relative;
}

.user {
  background: #2563eb;
  margin-left: auto;
  color: white;
}

.bot {
  background: #1e293b;
  margin-right: auto;
}

.light-mode .bot {
  background: #e2e8f0;
  color: black;
}

.copy-btn {
  position: absolute;
  right: 8px;
  top: 8px;
  font-size: 12px;
  cursor: pointer;
  opacity: 0.7;
}

.copy-btn:hover {
  opacity: 1;
}

.input-area {
  display: flex;
  padding: 10px;
  background: #020617;
}

.light-mode .input-area {
  background: #e2e8f0;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: none;
  outline: none;
}

button {
  margin-left: 10px;
  padding: 12px 20px;
  background: #22c55e;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

.typing {
  font-size: 14px;
  opacity: 0.7;
}
</style>

</head>

<body>

<div class="header">
  🤖 AI Carbon Assistant
  <span class="toggle-btn" onclick="toggleMode()">🌙</span>
</div>

<div class="chat-container" id="chat"></div>

<div class="input-area">
  <input type="text" id="question" placeholder="Ask something..." aria-label="Enter your question" onkeypress="handleKey(event)" required >
  <button onclick="ask()" aria-label="Send message">Send</button>
</div>

<script>
const chat = document.getElementById("chat");

window.onload = () => {
  addMessage("👋 Ask me about your carbon footprint!", "bot");
};

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;

  if (type === "bot") {
    const copy = document.createElement("span");
    copy.innerText = "📋";
    copy.className = "copy-btn";
    copy.onclick = () => {
      navigator.clipboard.writeText(text);
      copy.innerText = "✅";
      setTimeout(() => copy.innerText = "📋", 1000);
    };
    div.appendChild(copy);
  }

  const content = document.createElement("div");
  content.innerText = text;

  div.appendChild(content);
  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

function handleKey(e) {
  if (e.key === "Enter") ask();
}

async function ask() {
  const input = document.getElementById("question");
  const q = input.value;

  if (!q) return;

  addMessage(q, "user");
  input.value = "";

  const typing = document.createElement("div");
  typing.className = "message bot typing";
  typing.innerText = "⏳ Generating smart answer...";
  chat.appendChild(typing);

  const res = await fetch("/ask", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ q })
  });

  if (!res.ok) {
  chat.removeChild(typing);
  addMessage("Server error. Please try again.", "bot");
  return;
}

  const data = await res.text();

  chat.removeChild(typing);

  // Remove HTML tags
  const cleanText = data.replace(/<[^>]*>?/gm, '');

  addMessage(cleanText, "bot");
}

function toggleMode() {
  document.body.classList.toggle("light-mode");
}
</script>

</body>
</html>
